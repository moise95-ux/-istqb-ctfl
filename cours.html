<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css">
<title>ISTQB — Cours & QCM</title>
</head>
<body>
<header><div class="wrap"><h1 id="pageTitle">Cours ISTQB CTFL v4.0.1</h1><p>Apprendre · s'entraîner · mesurer son niveau</p></div></header>
<div class="wrap">
<nav class="nav"><a href="./index.html">Accueil</a><a class="active" href="./cours.html">Cours & QCM</a></nav>
<div id="app"></div>
</div>
<footer>Questions originales inspirées des objectifs et notions CTFL v4.0.1. Aucun examen officiel n'est reproduit mot pour mot.</footer>
<script src="./data.js"></script>
<script>
const courses=window.ISTQB_COURSES, questions=window.ISTQB_QUESTIONS;
const params=new URLSearchParams(location.search);
let mode='course', chapter=1, quizQuestions=[], current=0, answers={}, examIndex=null, timer=null, remaining=3600, submitted=false;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function home(){location.href='./index.html'}
function renderCourse(){
 mode='course';
 const hash=(location.hash||'').replace('#ch','');
 chapter=parseInt(hash)||1;
 const c=courses[chapter];
 document.getElementById('pageTitle').textContent=c.title;
 document.getElementById('app').innerHTML=`
 <div class="card"><span class="badge">CHAPITRE ${chapter}</span><h2>${c.title}</h2><p>${c.intro}</p></div>
 <div class="actions">
 ${Object.keys(courses).map(k=>`<a class="btn ${+k===chapter?'primary':''}" href="./cours.html#ch${k}">Ch. ${k}</a>`).join('')}
 <a class="btn" href="./cours.html?quiz=${chapter}">📝 QCM du chapitre</a>
 </div>
 <div class="card" style="margin-top:14px">${c.sections.map((s,i)=>`<div class="section"><h3>${i+1}. ${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join('')}</div>
 <div class="card"><h2>🧠 Fiche express</h2><ul class="list">
 ${chapter===1?'<li>7 principes de test</li><li>Test ≠ débogage</li><li>Traçabilité et activités de test</li>':''}
 ${chapter===2?'<li>Niveaux de test</li><li>Tests fonctionnels/non fonctionnels</li><li>Agile, régression, maintenance</li>':''}
 ${chapter===3?'<li>Revues et analyse statique</li><li>Objectifs, rôles, préparation</li><li>Culture constructive</li>':''}
 ${chapter===4?'<li>Équivalence</li><li>Valeurs limites</li><li>Tables de décision</li><li>Transitions d’état</li><li>Exploratoire/checklists</li>':''}
 ${chapter===5?'<li>Planification et risques</li><li>Priorisation et suivi</li><li>Défauts, testware, configuration</li>':''}
 ${chapter===6?'<li>Bénéfices et risques des outils</li><li>Automatisation</li><li>Choix et introduction d’un outil</li>':''}
 </ul></div>`;
}
function startQuiz(ch){
 mode='quiz';chapter=+ch;current=0;answers={};submitted=false;
 quizQuestions=questions.filter(x=>x.ch===chapter).sort(()=>Math.random()-.5);
 document.getElementById('pageTitle').textContent='QCM — '+courses[chapter].title;
 renderQuiz();
}
function startExam(idx){
 mode='exam';examIndex=+idx;current=0;answers={};submitted=false;remaining=3600;
 const ids=window.ISTQB_MOCKS[examIndex];
 quizQuestions=ids.map(id=>questions.find(x=>x.id===id));
 document.getElementById('pageTitle').textContent='Examen blanc '+(examIndex+1);
 renderQuiz();
 startTimer();
}
function renderQuiz(){
 const total=quizQuestions.length, q=quizQuestions[current], selected=answers[q.id];
 const isExam=mode==='exam';
 document.getElementById('app').innerHTML=`
 <div class="quiz-head">
 <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
 <div><b>${isExam?'Examen blanc':'QCM chapitre'}</b><div class="muted small">Question ${current+1}/${total}</div></div>
 ${isExam?'<div id="timer" class="timer">60:00</div>':''}
 </div>
 <div class="progress" style="margin-top:8px"><span style="width:${((current+1)/total)*100}%"></span></div>
 </div>
 <div class="question">
 <div class="badge">Chapitre ${q.ch}</div>
 <h2>${esc(q.q)}</h2>
 ${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
 </div>
 <div class="actions">
 <button class="btn" onclick="prevQ()" ${current===0?'disabled':''}>← Précédente</button>
 <button class="btn" onclick="nextQ()">${current===total-1?(isExam?'Terminer':'Voir le résultat'):'Suivante →'}</button>
 ${isExam?'<button class="btn" onclick="submitExam()">Terminer maintenant</button>':''}
 <button class="btn" onclick="goBack()">Quitter</button>
 </div>
 <div class="card" style="margin-top:12px"><b>Navigation</b><div class="navgrid">
 ${quizQuestions.map((x,i)=>`<button class="qnum ${i===current?'current':''} ${answers[x.id]!==undefined?'done':''}" onclick="goQ(${i})">${i+1}</button>`).join('')}
 </div><p class="muted small">${Object.keys(answers).length}/${total} question(s) répondue(s).</p></div>`;
 if(isExam) updateTimer();
}
function choose(i){answers[quizQuestions[current].id]=i;renderQuiz()}
function nextQ(){if(current<quizQuestions.length-1){current++;renderQuiz()}else finishQuiz()}
function prevQ(){if(current>0){current--;renderQuiz()}}
function goQ(i){current=i;renderQuiz()}
function goBack(){if(confirm('Quitter cette session ? La progression de ce QCM ne sera pas conservée.')){if(timer)clearInterval(timer);renderCourse()}}
function startTimer(){
 if(timer)clearInterval(timer);
 timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);alert('Temps écoulé : l’examen est automatiquement terminé.');finishExam(true)}},1000);
}
function updateTimer(){
 const el=document.getElementById('timer');if(!el)return;
 const m=Math.floor(remaining/60),s=remaining%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 el.classList.toggle('warning',remaining<=900&&remaining>300);el.classList.toggle('danger',remaining<=300);
}
function submitExam(){if(confirm('Terminer l’examen maintenant ?'))finishExam(false)}
function finishQuiz(){
 submitted=true;
 const total=quizQuestions.length;let score=0;
 quizQuestions.forEach(x=>{if(answers[x.id]===x.answer)score++});
 renderResult(score,total,false);
}
function finishExam(auto){
 if(submitted)return;submitted=true;if(timer)clearInterval(timer);
 const total=quizQuestions.length;let score=0;
 quizQuestions.forEach(x=>{if(answers[x.id]===x.answer)score++});
 const stats=JSON.parse(localStorage.getItem('istqbStats')||'[]');
 stats.push({date:new Date().toISOString(),score,auto});
 localStorage.setItem('istqbStats',JSON.stringify(stats.slice(-30)));
 renderResult(score,total,true);
}
function renderResult(score,total,isExam){
 const pass=isExam?(score>=26):(score/total>=.7);
 document.getElementById('pageTitle').textContent='Résultat';
 let review=quizQuestions.map((x,i)=>{
   const a=answers[x.id], ok=a===x.answer;
   return `<div class="review ${ok?'good':'bad'}"><b>${i+1}. ${esc(x.q)}</b>
   <p><b>${ok?'✓ Correct':'✗ Incorrect'}</b> — Bonne réponse : <b>${String.fromCharCode(65+x.answer)}. ${esc(x.options[x.answer])}</b></p>
   ${a===undefined?'<p>Tu n’as pas répondu à cette question.</p>':(!ok?`<p>Ta réponse : ${String.fromCharCode(65+a)}. ${esc(x.options[a])}</p>`:'')}
   <p class="muted">${esc(x.explanation)}</p>${x.objective?`<span class="badge">Objectif ${esc(x.objective)}</span>`:''}</div>`;
 }).join('');
 document.getElementById('app').innerHTML=`
 <div class="result"><span class="badge">RESULTAT</span><h2 class="${pass?'pass':'fail'}">${score}/${total} — ${Math.round(score/total*100)}%</h2>
 <p>${isExam?(pass?'🎉 Réussi — seuil CTFL : 26/40.':'❌ Non réussi — seuil CTFL : 26/40.'):(pass?'Bon niveau sur ce chapitre.':'À revoir : relis le cours puis refais le QCM.')}</p>
 <div class="actions"><button class="btn primary" onclick="${isExam?'location.href=\\'./index.html\\'':'location.href=\\'./cours.html#ch'+chapter+'\\''}">Continuer</button>
 <button class="btn" onclick="location.reload()">Recommencer</button></div></div>
 <h2>Correction détaillée</h2>${review}`;
}
function init(){
 if(params.has('quiz'))return startQuiz(params.get('quiz'));
 if(params.has('exam'))return startExam(params.get('exam'));
 renderCourse();
}
window.addEventListener('hashchange',()=>{if(!params.has('quiz')&&!params.has('exam'))renderCourse()});
init();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
