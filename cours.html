<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e3a8a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"><title>ISTQB — Cours & QCM</title></head><body><header><div class="wrap"><h1 id="pageTitle">Cours ISTQB CTFL v4.0.1</h1><p>Comprendre · appliquer · s'entraîner</p></div></header><div class="wrap"><nav class="nav"><a href="./index.html">Accueil</a><a class="active" href="./cours.html">Cours & QCM</a><a href="./ressources.html">📚 Ressources</a></nav><div id="app"></div></div><footer>CTFL v4.0.1 · Cours intégrés dans l'application · Questions originales</footer><script src="./data.js"></script><script>
const courses=window.ISTQB_COURSES,questions=window.ISTQB_QUESTIONS;const params=new URLSearchParams(location.search);let mode='course',chapter=1,quizQuestions=[],current=0,answers={},examIndex=null,timer=null,remaining=3600,submitted=false,examLabel='';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderCourse(){mode='course';const hash=(location.hash||'').replace('#ch','');chapter=parseInt(hash)||1;const c=courses[chapter];document.getElementById('pageTitle').textContent='Chapitre '+chapter+' — '+c.title;document.getElementById('app').innerHTML=`
<div class="card hero-course"><span class="badge">CHAPITRE ${chapter} · CTFL v4.0.1</span><h2>${c.title}</h2><p>${c.intro}</p><div class="callout"><b>Objectif :</b> comprendre les notions, savoir les expliquer avec tes propres mots et être capable de les appliquer dans une question d'examen.</div></div>
<div class="chapter-tabs">${Object.keys(courses).map(k=>`<a class="btn ${+k===chapter?'primary':''}" href="./cours.html#ch${k}">Ch. ${k}</a>`).join('')}</div>
<div class="course-layout"><main><div class="card"><h2>📖 Cours détaillé</h2><p class="muted">Ce contenu est directement intégré dans l'application. Il ne s'agit pas d'un simple résumé : chaque chapitre est découpé en leçons avec explications et exemples.</p>${c.sections.map((s,i)=>`<article class="lesson"><div class="lesson-num">${i+1}</div><div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div></article>`).join('')}</div>
<div class="card"><h2>💡 Exemple concret</h2><p>${esc(c.example)}</p></div>
<div class="card"><h2>🎯 Ce qu'il faut savoir pour l'examen</h2><ul class="list">${c.examTips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></main>
<aside><div class="card sticky-card"><h3>🚀 Pour t'entraîner</h3><a class="btn primary full" href="./cours.html?quiz=${chapter}">Faire le QCM du chapitre</a><a class="btn full" href="./cours.html?chapterExam=${chapter}">Examen blanc du chapitre</a><p class="muted small">15 questions · 60 min · objectif 70 %</p></div></aside></div>`}
function startQuiz(ch){mode='quiz';chapter=+ch;current=0;answers={};submitted=false;quizQuestions=questions.filter(x=>x.ch===chapter).sort(()=>Math.random()-.5);examLabel='QCM du chapitre';document.getElementById('pageTitle').textContent=examLabel+' — '+courses[chapter].title;renderQuiz()}
function startExam(idx){mode='exam';examIndex=+idx;current=0;answers={};submitted=false;remaining=3600;quizQuestions=window.ISTQB_MOCKS[examIndex].map(id=>questions.find(x=>x.id===id));examLabel='Examen complet '+(examIndex+1);document.getElementById('pageTitle').textContent=examLabel;renderQuiz();startTimer()}
function startChapterExam(ch){mode='chapterExam';chapter=+ch;current=0;answers={};submitted=false;remaining=3600;quizQuestions=window.ISTQB_CHAPTER_EXAMS[String(ch)].map(id=>questions.find(x=>x.id===id));examLabel='Examen blanc — chapitre '+ch;document.getElementById('pageTitle').textContent=examLabel;renderQuiz();startTimer()}
function renderQuiz(){const total=quizQuestions.length,q=quizQuestions[current],selected=answers[q.id],timed=mode!=='quiz';document.getElementById('app').innerHTML=`<div class="quiz-head"><div class="quiz-top"><div><b>${esc(examLabel)}</b><div class="muted small">Question ${current+1}/${total}</div></div>${timed?'<div><div id="timer" class="timer">60:00</div><div class="muted small">Temps restant</div></div>':''}</div><div class="progress"><span style="width:${((current+1)/total)*100}%"></span></div></div><div class="question"><div class="badge">Chapitre ${q.ch}</div><h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="actions"><button class="btn" onclick="prevQ()" ${current===0?'disabled':''}>← Précédente</button><button class="btn primary" onclick="nextQ()">${current===total-1?(timed?'Terminer':'Voir le résultat'):'Suivante →'}</button>${timed?'<button class="btn" onclick="submitExam()">Terminer maintenant</button>':''}<button class="btn" onclick="goBack()">Quitter</button></div><div class="card" style="margin-top:12px"><b>Navigation</b><div class="navgrid">${quizQuestions.map((x,i)=>`<button class="qnum ${i===current?'current':''} ${answers[x.id]!==undefined?'done':''}" onclick="goQ(${i})">${i+1}</button>`).join('')}</div><p class="muted small">${Object.keys(answers).length}/${total} question(s) répondue(s).</p></div>`;if(timed)updateTimer()}
function choose(i){answers[quizQuestions[current].id]=i;renderQuiz()}function nextQ(){if(current<quizQuestions.length-1){current++;renderQuiz()}else if(mode==='quiz')finishQuiz();else finishExam(false)}function prevQ(){if(current>0){current--;renderQuiz()} }function goQ(i){current=i;renderQuiz()}
function goBack(){if(confirm('Quitter cette session ? La progression ne sera pas conservée.')){if(timer)clearInterval(timer);location.href='./cours.html#ch'+chapter}}
function startTimer(){if(timer)clearInterval(timer);timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);finishExam(true)}},1000)}
function updateTimer(){const el=document.getElementById('timer');if(!el)return;const m=Math.floor(remaining/60),s=remaining%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('warning',remaining<=900&&remaining>300);el.classList.toggle('danger',remaining<=300)}
function submitExam(){if(confirm('Terminer l’examen maintenant ?'))finishExam(false)}
function scoreNow(){let score=0;quizQuestions.forEach(x=>{if(answers[x.id]===x.answer)score++});return score}
function finishQuiz(){submitted=true;renderResult(scoreNow(),quizQuestions.length,false)}
function finishExam(auto){if(submitted)return;submitted=true;if(timer)clearInterval(timer);const total=quizQuestions.length,score=scoreNow();const stats=JSON.parse(localStorage.getItem('istqbStats')||'[]');stats.push({date:new Date().toISOString(),score,total,type:mode,label:examLabel,auto});localStorage.setItem('istqbStats',JSON.stringify(stats.slice(-50)));renderResult(score,total,true)}
function finishChapterQuiz(){finishQuiz()}
function renderResult(score,total,timed){const pass=mode==='exam'?(score>=26):(score/total>=.7);let review=quizQuestions.map((x,i)=>{const a=answers[x.id],ok=a===x.answer;return `<div class="review ${ok?'good':'bad'}"><b>${i+1}. ${esc(x.q)}</b><p><b>${ok?'✓ Correct':'✗ Incorrect'}</b> — Bonne réponse : <b>${String.fromCharCode(65+x.answer)}. ${esc(x.options[x.answer])}</b></p>${a===undefined?'<p>Tu n’as pas répondu.</p>':(!ok?`<p>Ta réponse : ${String.fromCharCode(65+a)}. ${esc(x.options[a])}</p>`:'')}<p class="muted">💡 ${esc(x.explanation)}</p><span class="badge">Objectif ${esc(x.objective||'')}</span></div>`}).join('');document.getElementById('pageTitle').textContent='Résultat — '+examLabel;document.getElementById('app').innerHTML=`<div class="result"><span class="badge">${timed?'EXAMEN BLANC':'QCM'}</span><h2 class="${pass?'pass':'fail'}">${score}/${total} — ${Math.round(score/total*100)}%</h2><p>${timed?(mode==='exam'?(pass?'🎉 Réussi — seuil CTFL : 26/40.':'❌ Sous le seuil CTFL de 26/40.'):(pass?'🎉 Objectif chapitre atteint (70 %).':'📚 Objectif non atteint : reprends le cours et retente le chapitre.')):(pass?'Bon niveau sur ce chapitre.':'À revoir : relis les leçons puis refais le QCM.')}</p><div class="actions"><a class="btn primary" href="./cours.html#ch${chapter}">Revenir au cours</a><button class="btn" onclick="location.reload()">Recommencer</button><a class="btn" href="./index.html">Accueil</a></div></div><h2>Correction détaillée</h2>${review}`}
function init(){if(params.has('quiz'))return startQuiz(params.get('quiz'));if(params.has('exam'))return startExam(params.get('exam'));if(params.has('chapterExam'))return startChapterExam(params.get('chapterExam'));renderCourse()}window.addEventListener('hashchange',()=>{if(!params.has('quiz')&&!params.has('exam')&&!params.has('chapterExam'))renderCourse()});init();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
